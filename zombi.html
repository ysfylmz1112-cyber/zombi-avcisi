<style>
*{
    box-sizing:border-box;

html,body{

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- ANA MENÜ -->

<h1 id="title">ZOMBİ AVCISI: ULTIMATE</h1>

<div class="section">
<label>DİL / LANGUAGE</label>

<button class="choice active" onclick="difficulty('normal',this)">Normal</button>
<button class="choice" onclick="difficulty('hard',this)">Zor</button>

</div>

<!-- AYARLAR -->

<h1>OYUN AYARLARI</h1>

<label>Efekt Sesleri: <span id="sfxValue">80</span>%</label>
<input class="slider" id="sfx" type="range" min="0" max="100" value="80">

<label>Genel Ses: <span id="masterValue">100</span>%</label>
<input class="slider" id="master" type="range" min="0" max="100" value="100">

<label>
Ekran Sarsıntısı
<input id="shake" type="checkbox" checked>
</label>

<button class="secondary" onclick="closeSettings()">GERİ DÖN</button>

</div>

<!-- UI -->
<div id="ui">

<div class="stat">
<span>❤️ Can: <span id="hp">100/100</span></span>
<span>⭐ Seviye: <span id="level">1</span></span>
</div>

<div class="stat">
<span>✨ XP: <span id="xp">0</span>/<span id="maxxp">40</span></span>
<span>💀 Öldürme: <span id="kills">0</span></span>
</div>

<div class="stat">
<span>🔫 Silah: <span id="weapon">Standart</span></span>
<span>💥 Hasar: <span id="damage">12</span></span>
</div>

</div>

<div id="message"></div>

<!-- GELİŞTİRME -->
<div id="upgrade">

<h2>⭐ SEVİYE ATLADIN!</h2>
<p style="color:#aaa;font-size:12px">Bir geliştirme seç</p>

<div id="cards"></div>

</div>

<div id="dash" onclick="dash()">💨</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

/* =========================
   DİL
========================= */

const texts={

tr:{
title:"ZOMBİ AVCISI: ULTIMATE",
diff:"ZORLUK",
start:"OYUNA BAŞLA",
settings:"AYARLAR"
},

en:{
title:"ZOMBIE HUNTER: ULTIMATE",
diff:"DIFFICULTY",
start:"START GAME",
settings:"SETTINGS"
},

es:{
title:"CAZADOR DE ZOMBIS: ULTIMATE",
diff:"DIFICULTAD",
start:"COMENZAR",
settings:"AJUSTES"
},

fr:{
title:"CHASSEUR DE ZOMBIES: ULTIMATE",
diff:"DIFFICULTÉ",
start:"COMMENCER",
settings:"PARAMÈTRES"
},

de:{
title:"ZOMBIE-JÄGER: ULTIMATE",
diff:"SCHWIERIGKEIT",
start:"STARTEN",
settings:"EINSTELLUNGEN"
},

it:{
title:"CACCIATORE DI ZOMBIE: ULTIMATE",
diff:"DIFFICOLTÀ",
start:"AVVIA GIOCO",
settings:"IMPOSTAZIONI"
},

ru:{
title:"ОХОТНИК НА ЗОМБИ: ULTIMATE",
diff:"СЛОЖНОСТЬ",
start:"ИГРАТЬ",
settings:"НАСТРОЙКИ"
}

};

let lang="tr";
let diff="normal";
let multiplier=1;

function language(l,btn){

    lang=l;

    document.querySelectorAll("#menu .section:first-of-type .choice")
    .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("title").textContent=texts[l].title;
    document.getElementById("difficultyLabel").textContent=texts[l].diff;
    document.getElementById("startButton").textContent=texts[l].start;
    document.getElementById("settingsButton").textContent=texts[l].settings;
}

function difficulty(d,btn){

    diff=d;

    document.querySelectorAll("#menu .section:nth-of-type(2) .choice")
    .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    if(d==="easy") multiplier=.75;
    if(d==="normal") multiplier=1;
    if(d==="hard") multiplier=1.35;
    if(d==="extreme") multiplier=1.75;

    resetPlayer();
}

/* =========================
   AYARLAR
========================= */

const sfx=document.getElementById("sfx");
const master=document.getElementById("master");

sfx.oninput=()=>document.getElementById("sfxValue").textContent=sfx.value;
master.oninput=()=>document.getElementById("masterValue").textContent=master.value;

function openSettings(){
    document.getElementById("menu").style.display="none";
    document.getElementById("settings").style.display="flex";
}

function closeSettings(){
    document.getElementById("settings").style.display="none";
    document.getElementById("menu").style.display="flex";
}

/* =========================
   OYUNCU
========================= */

let player;

function resetPlayer(){

    let hp=100;

    if(diff==="easy") hp=120;
    if(diff==="normal") hp=100;
    if(diff==="hard") hp=80;
    if(diff==="extreme") hp=60;

    player={
        x:W/2,
        y:H/2,
        hp:hp,
        maxHp:hp,
        speed:4.2,
        damage:12,
        angle:0,
        cooldown:0,
        cooldownMax:18,
        level:1,
        xp:0,
        maxXp:40,
        kills:0,

        weapon:1,
        boomerang:0,
        shuriken:0,
        tesla:0,
        frost:0,
        turret:0,

        dashCooldown:0
    };
}

resetPlayer();

/* =========================
   KLAVYE
========================= */

const keys={
    w:false,
    a:false,
    s:false,
    d:false
};

addEventListener("keydown",e=>{

    if(e.key==="w" || e.key==="W") keys.w=true;
    if(e.key==="a" || e.key==="A") keys.a=true;
    if(e.key==="s" || e.key==="S") keys.s=true;
    if(e.key==="d" || e.key==="D") keys.d=true;

    if(e.code==="Space" || e.key==="e" || e.key==="E"){
        e.preventDefault();
        dash();
    }
});

addEventListener("keyup",e=>{

    if(e.key==="w" || e.key==="W") keys.w=false;
    if(e.key==="a" || e.key==="A") keys.a=false;
    if(e.key==="s" || e.key==="S") keys.s=false;
    if(e.key==="d" || e.key==="D") keys.d=false;
});

/* =========================
   MOUSE
========================= */

let mouse={x:W/2,y:H/2};

canvas.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

/* =========================
   OYUN
========================= */

let running=false;

function startGame(){

    document.getElementById("menu").style.display="none";
    document.getElementById("ui").style.display="flex";
    document.getElementById("dash").style.display="flex";

    resetPlayer();

    zombies=[];
    bullets=[];
    particles=[];
    orbs=[];

    running=true;
}

/* =========================
   ZOMBİLER
========================= */

let zombies=[];
let spawnTimer=0;

function spawnZombie(){

    let side=Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=-40;
        y=Math.random()*H;
    }

    if(side===1){
        x=W+40;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=-40;
    }

    if(side===3){
        x=Math.random()*W;
        y=H+40;
    }

    let hp=30+player.level*7;

    zombies.push({
        x:x,
        y:y,
        hp:hp,
        maxHp:hp,
        speed:(1+Math.random()*.6)*multiplier,
        radius:18
    });
}

/* =========================
   MERMİ
========================= */

let bullets=[];

function shoot(){

    if(player.cooldown>0)return;
    if(zombies.length===0)return;

    let nearest=null;
    let distance=Infinity;

    for(const z of zombies){

        let d=Math.hypot(z.x-player.x,z.y-player.y);

        if(d<distance){
            distance=d;
            nearest=z;
        }
    }

    if(!nearest || distance>800)return;

    player.angle=Math.atan2(
        nearest.y-player.y,
        nearest.x-player.x
    );

    let count=1;

    if(player.weapon>=2) count=2;
    if(player.weapon>=6) count=3;

    for(let i=0;i<count;i++){

        let spread=(i-(count-1)/2)*.12;

        let angle=player.angle+spread;

        bullets.push({
            x:player.x,
            y:player.y,
            vx:Math.cos(angle)*16,
            vy:Math.sin(angle)*16,
            damage:player.damage*(player.weapon>=6?1.5:1),
            life:70,
            radius:4
        });
    }

    player.cooldown=player.cooldownMax;
}

/* =========================
   DASH
========================= */

function dash(){

    if(!running)return;
    if(player.dashCooldown>0)return;

    let dx=0;
    let dy=0;

    if(keys.w)dy--;
    if(keys.s)dy++;
    if(keys.a)dx--;
    if(keys.d)dx++;

    if(dx===0 && dy===0){
        dx=Math.cos(player.angle);
        dy=Math.sin(player.angle);
    }else{
        let len=Math.hypot(dx,dy);
        dx/=len;
        dy/=len;
    }

    player.x+=dx*110;
    player.y+=dy*110;

    player.x=Math.max(20,Math.min(W-20,player.x));
    player.y=Math.max(20,Math.min(H-20,player.y));

    player.dashCooldown=80;
}

/* =========================
   XP
========================= */

let orbs=[];

function addXP(amount){

    player.xp+=amount;

    if(player.xp>=player.maxXp){

        player.xp-=player.maxXp;
        player.level++;

        player.maxXp=Math.floor(player.maxXp*1.25);

        openUpgrade();
    }
}

/* =========================
   UPGRADE
========================= */

function openUpgrade(){

    running=false;

    const box=document.getElementById("upgrade");
    const cards=document.getElementById("cards");

    cards.innerHTML="";

    let options=[
        ["weapon","🔫 Silah Evrimi","Silah seviyesini artırır."],
        ["damage","💥 Hasar","Hasarı +8 artırır."],
        ["speed","⚡ Ateş Hızı","Daha hızlı ateş edersin."],
        ["heal","❤️ Sağlık","Canını tamamen doldurur ve maksimum canı artırır."],
        ["boomerang","🪃 Bumerang","Çevrende dönen saldırı."],
        ["shuriken","⭐ Shuriken","Yakındaki zombilere saldırır."],
        ["tesla","⚡ Tesla","Yakındaki zombilere elektrik verir."],
        ["frost","🧊 Buz","Zombileri yavaşlatır."]
    ];

    options.sort(()=>Math.random()-.5);

    options.slice(0,3).forEach(o=>{

        let div=document.createElement("div");

        div.className="card";

        div.innerHTML=`
            <div class="card-title">
                <span>${o[1]}</span>
                <span>+</span>
            </div>
            <div class="card-desc">${o[2]}</div>
        `;

        div.onclick=()=>upgrade(o[0]);

        cards.appendChild(div);
    });

    box.style.display="flex";
}

function upgrade(type){

    if(type==="weapon"){
        player.weapon=Math.min(10,player.weapon+1);
        player.cooldownMax=Math.max(5,player.cooldownMax-2);
    }

    if(type==="damage"){
        player.damage+=8;
    }

    if(type==="speed"){
        player.cooldownMax=Math.max(4,player.cooldownMax-3);
    }

    if(type==="heal"){
        player.maxHp+=25;
        player.hp=player.maxHp;
    }

    if(type==="boomerang"){
        player.boomerang++;
    }

    if(type==="shuriken"){
        player.shuriken++;
    }

    if(type==="tesla"){
        player.tesla++;
    }

    if(type==="frost"){
        player.frost++;
    }

    document.getElementById("upgrade").style.display="none";

    running=true;

    updateUI();
}

/* =========================
   GÜNCELLEME
========================= */

function update(){

    if(!running)return;

    /* hareket */

    let dx=0;
    let dy=0;

    if(keys.w)dy--;
    if(keys.s)dy++;
    if(keys.a)dx--;
    if(keys.d)dx++;

    if(dx!==0 || dy!==0){

        let len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;
    }

    player.x=Math.max(15,Math.min(W-15,player.x));
    player.y=Math.max(15,Math.min(H-15,player.y));

    if(player.cooldown>0)player.cooldown--;
    if(player.dashCooldown>0)player.dashCooldown--;

    /* ateş */

    shoot();

    /* spawn */

    spawnTimer--;

    if(spawnTimer<=0){

        spawnZombie();

        spawnTimer=Math.max(
            12,
            45-player.level*2
        );
    }

    /* zombiler */

    for(const z of zombies){

        let dx=player.x-z.x;
        let dy=player.y-z.y;

        let d=Math.hypot(dx,dy);

        if(d>0){

            let speed=z.speed;

            if(player.frost>0 && d<250){
                speed*=Math.max(.35,1-player.frost*.06);
            }

            z.x+=dx/d*speed;
            z.y+=dy/d*speed;
        }

        if(d<30){

            player.hp-=.25*multiplier;

            if(player.hp<=0){
                gameOver();
                return;
            }
        }
    }

    /* mermiler */

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;

        let removed=false;

        for(let j=zombies.length-1;j>=0;j--){

            let z=zombies[j];

            if(Math.hypot(b.x-z.x,b.y-z.y)<z.radius+b.radius){

                z.hp-=b.damage;

                b.life=0;

                if(z.hp<=0){

                    player.kills++;

                    orbs.push({
                        x:z.x,
                        y:z.y,
                        value:10
                    });

                    zombies.splice(j,1);

                    addXP(10);
                }

                removed=true;
                break;
            }
        }

        if(removed || b.life<=0){
            bullets.splice(i,1);
        }
    }

    /* XP orb */

    for(let i=orbs.length-1;i>=0;i--){

        let o=orbs[i];

        let d=Math.hypot(
            player.x-o.x,
            player.y-o.y
        );

        if(d<90){

            let dx=player.x-o.x;
            let dy=player.y-o.y;

            let len=Math.max(1,d);

            o.x+=dx/len*5;
            o.y+=dy/len*5;
        }

        if(d<18){

            addXP(o.value);
            orbs.splice(i,1);
        }
    }

    updateUI();
}

/* =========================
   ÇİZİM
========================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    /* zemin */

    ctx.fillStyle="#08090d";
    ctx.fillRect(0,0,W,H);

    /* grid */

    ctx.strokeStyle="rgba(255,255,255,.035)";
    ctx.lineWidth=1;

    for(let x=0;x<W;x+=40){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=40){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    /* XP */

    for(const o of orbs){

        ctx.fillStyle="#f1c40f";

        ctx.beginPath();
        ctx.arc(o.x,o.y,5,0,Math.PI*2);
        ctx.fill();
    }

    /* zombiler */

    for(const z of zombies){

        ctx.fillStyle="#27ae60";

        ctx.beginPath();
        ctx.arc(z.x,z.y,z.radius,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(z.x-6,z.y-4,3,0,Math.PI*2);
        ctx.arc(z.x+6,z.y-4,3,0,Math.PI*2);
        ctx.fill();

        /* can */

        ctx.fillStyle="#222";
        ctx.fillRect(z.x-20,z.y-28,40,4);

        ctx.fillStyle="#e74c3c";
        ctx.fillRect(
            z.x-20,
            z.y-28,
            40*(z.hp/z.maxHp),
            4
        );
    }

    /* mermiler */

    for(const b of bullets){

        ctx.fillStyle="#f1c40f";

        ctx.beginPath();
        ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
        ctx.fill();
    }

    /* oyuncu */

    ctx.save();

    ctx.translate(player.x,player.y);

    ctx.rotate(player.angle);

    ctx.fillStyle="#3498db";

    ctx.beginPath();
    ctx.moveTo(20,0);
    ctx.lineTo(-14,-13);
    ctx.lineTo(-9,0);
    ctx.lineTo(-14,13);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#f1c40f";
    ctx.fillRect(4,-3,18,6);

    ctx.restore();

    /* shuriken */

    if(player.shuriken>0){

        ctx.strokeStyle="#00ffff";
        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            35+player.shuriken*5,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /* tesla */

    if(player.tesla>0){

        ctx.strokeStyle="rgba(0,255,255,.3)";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            100+player.tesla*15,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }
}

/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById("hp").textContent=
        Math.max(0,Math.ceil(player.hp))+
        "/"+
        Math.ceil(player.maxHp);

    document.getElementById("level").textContent=
        player.level;

    document.getElementById("xp").textContent=
        player.xp;

    document.getElementById("maxxp").textContent=
        player.maxXp;

    document.getElementById("kills").textContent=
        player.kills;

    document.getElementById("damage").textContent=
        Math.floor(player.damage);

    const weapons=[
        "Standart",
        "İkili Tabanca",
        "Taktiksel Seri",
        "Assault Tüfek",
        "Plazma",
        "Ağır Lazer",
        "Foton Topu",
        "Üçlü Dağıtıcı",
        "Yıkıcı Top",
        "Kıyamet"
    ];

    document.getElementById("weapon").textContent=
        weapons[Math.min(player.weapon,9)];
}

/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    document.getElementById("ui").style.display="none";
    document.getElementById("dash").style.display="none";

    document.getElementById("message").textContent=
        "💀 ÖLDÜN! Öldürme: "+player.kills;

    document.getElementById("message").style.display="block";

    setTimeout(()=>{

        document.getElementById("message").style.display="none";
        document.getElementById("menu").style.display="flex";

        resetPlayer();

    },2500);
}

/* =========================
   OYUN DÖNGÜSÜ
========================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>
