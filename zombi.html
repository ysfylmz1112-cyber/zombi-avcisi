<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Zombie Hunter: Ultimate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#020205;color:#fff;font-family:"Courier New",monospace}
#game{position:relative;width:100vw;height:100vh}
canvas{position:absolute;inset:0;width:100%;height:100%;background:#020205;touch-action:none}
.menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;background:rgba(5,5,10,.97)}
.menu h1{color:#f1c40f;text-align:center;font-size:30px;text-shadow:0 0 20px #f1c40f}
.section{width:350px;text-align:center}.section label{display:block;margin-bottom:7px;color:#aaa;font-size:12px}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}button{font-family:"Courier New",monospace;cursor:pointer;touch-action:manipulation}
.choice{padding:8px 12px;border:2px solid #444;border-radius:6px;background:#1b2631;color:#fff;font-weight:bold}.choice.active{background:#f1c40f;color:#000;border-color:#f1c40f}
.start{padding:14px 35px;border:0;border-radius:10px;color:#fff;background:linear-gradient(135deg,#e74c3c,#c0392b);font-size:16px;font-weight:bold;box-shadow:0 0 25px rgba(231,76,60,.6)}
.secondary{padding:10px 25px;border:2px solid #555;border-radius:8px;background:#1a252f;color:#fff}
#ui{position:absolute;z-index:10;top:12px;left:12px;width:390px;padding:12px 16px;display:none;flex-direction:column;gap:6px;border:2px solid #e74c3c;border-radius:12px;background:rgba(10,10,15,.88)}
.stat{display:flex;justify-content:space-between;font-size:12px;font-weight:bold}
#message{position:absolute;z-index:50;bottom:30px;left:50%;transform:translateX(-50%);display:none;padding:12px 24px;border:1px solid #f1c40f;border-radius:8px;background:rgba(15,15,20,.95);color:#f1c40f;font-weight:bold;white-space:nowrap}
#upgrade{position:absolute;z-index:40;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,92vw);padding:25px;display:none;flex-direction:column;gap:14px;text-align:center;border:3px solid #f1c40f;border-radius:18px;background:rgba(10,10,15,.98)}
.card{padding:14px;border:2px solid #f1c40f;border-radius:10px;background:#1b2631;color:#fff;text-align:left;cursor:pointer;transition:.12s}.card:hover{border-color:#00ffff;transform:translateY(-2px)}
.card-title{color:#f1c40f;font-weight:bold;display:flex;justify-content:space-between}.card-desc{margin-top:5px;color:#ccc;font-size:11px}
#settings{display:none}.slider{width:300px;margin:8px}#dash{position:absolute;z-index:15;right:25px;bottom:25px;width:75px;height:75px;display:none;align-items:center;justify-content:center;border:2px solid #888;border-radius:50%;background:rgba(52,152,219,.9);color:#fff;font-size:20px;touch-action:manipulation}
@media(max-width:600px){#ui{width:calc(100vw - 24px);font-size:11px}.stat{font-size:10px}.menu h1{font-size:23px}.section{width:92vw}#dash{right:18px;bottom:18px}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="menu" class="menu">
<h1 id="title">ZOMBİ AVCISI: ULTIMATE</h1>
<div class="section"><label id="languageLabel">DİL / LANGUAGE</label><div class="buttons">
<button class="choice active" onclick="language('tr',this)">TR</button><button class="choice" onclick="language('en',this)">EN</button><button class="choice" onclick="language('es',this)">ES</button><button class="choice" onclick="language('fr',this)">FR</button><button class="choice" onclick="language('de',this)">DE</button><button class="choice" onclick="language('it',this)">IT</button><button class="choice" onclick="language('ru',this)">RU</button>
</div></div>
<div class="section"><label id="difficultyLabel">ZORLUK</label><div class="buttons">
<button class="choice" onclick="difficulty('easy',this)">Kolay</button><button class="choice active" onclick="difficulty('normal',this)">Normal</button><button class="choice" onclick="difficulty('hard',this)">Zor</button><button class="choice" onclick="difficulty('extreme',this)">Çok Zor</button>
</div></div>
<button class="start" id="startButton" onclick="startGame()">OYUNA BAŞLA</button><button class="secondary" id="settingsButton" onclick="openSettings()">AYARLAR</button>
</div>
<div id="settings" class="menu">
<h1 id="settingsTitle">OYUN AYARLARI</h1>
<label id="sfxLabel">Efekt Sesleri: <span id="sfxValue">80</span>%</label><input class="slider" id="sfx" type="range" min="0" max="100" value="80">
<label id="masterLabel">Genel Ses: <span id="masterValue">100</span>%</label><input class="slider" id="master" type="range" min="0" max="100" value="100">
<label id="shakeLabel">Ekran Sarsıntısı <input id="shake" type="checkbox" checked></label>
<button class="secondary" id="backButton" onclick="closeSettings()">GERİ DÖN</button>
</div>
<div id="ui">
<div class="stat"><span>❤️ Can: <span id="hp">100/100</span></span><span>⭐ Seviye: <span id="level">1</span></span></div>
<div class="stat"><span>✨ XP: <span id="xp">0</span>/<span id="maxxp">40</span></span><span>💀 Öldürme: <span id="kills">0</span></span></div>
<div class="stat"><span>🔫 Silah: <span id="weapon">Standart</span></span><span>💥 Hasar: <span id="damage">12</span></span></div>
</div>
<div id="message"></div>
<div id="upgrade"><h2 id="upgradeTitle">⭐ SEVİYE ATLADIN!</h2><p id="upgradeDesc" style="color:#aaa;font-size:12px">Bir geliştirme seç</p><div id="cards"></div></div>
<div id="dash" onclick="dash()">💨</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*devicePixelRatio);canvas.height=Math.floor(H*devicePixelRatio);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
const texts={
tr:{title:'ZOMBİ AVCISI: ULTIMATE',diff:'ZORLUK',start:'OYUNA BAŞLA',settings:'AYARLAR',back:'GERİ DÖN',settingsTitle:'OYUN AYARLARI',sfx:'Efekt Sesleri',master:'Genel Ses',shake:'Ekran Sarsıntısı',upgrade:'⭐ SEVİYE ATLADIN!',choose:'Bir geliştirme seç',easy:'Kolay',normal:'Normal',hard:'Zor',extreme:'Çok Zor'},
en:{title:'ZOMBIE HUNTER: ULTIMATE',diff:'DIFFICULTY',start:'START GAME',settings:'SETTINGS',back:'BACK',settingsTitle:'GAME SETTINGS',sfx:'Effects Volume',master:'Master Volume',shake:'Screen Shake',upgrade:'⭐ LEVEL UP!',choose:'Choose an upgrade',easy:'Easy',normal:'Normal',hard:'Hard',extreme:'Extreme'},
es:{title:'CAZADOR DE ZOMBIS: ULTIMATE',diff:'DIFICULTAD',start:'COMENZAR',settings:'AJUSTES',back:'VOLVER',settingsTitle:'AJUSTES DEL JUEGO',sfx:'Efectos',master:'Volumen general',shake:'Sacudida de pantalla',upgrade:'⭐ ¡SUBISTE DE NIVEL!',choose:'Elige una mejora',easy:'Fácil',normal:'Normal',hard:'Difícil',extreme:'Extremo'},
fr:{title:'CHASSEUR DE ZOMBIES: ULTIMATE',diff:'DIFFICULTÉ',start:'COMMENCER',settings:'PARAMÈTRES',back:'RETOUR',settingsTitle:'PARAMÈTRES DU JEU',sfx:'Effets',master:'Volume général',shake:'Tremblement',upgrade:'⭐ NIVEAU SUPÉRIEUR !',choose:'Choisis une amélioration',easy:'Facile',normal:'Normal',hard:'Difficile',extreme:'Extrême'},
de:{title:'ZOMBIE-JÄGER: ULTIMATE',diff:'SCHWIERIGKEIT',start:'STARTEN',settings:'EINSTELLUNGEN',back:'ZURÜCK',settingsTitle:'SPIELEINSTELLUNGEN',sfx:'Effekte',master:'Gesamtlautstärke',shake:'Bildschirmwackeln',upgrade:'⭐ LEVEL AUFGESTIEGEN!',choose:'Verbesserung wählen',easy:'Leicht',normal:'Normal',hard:'Schwer',extreme:'Extrem'},
it:{title:'CACCIATORE DI ZOMBIE: ULTIMATE',diff:'DIFFICOLTÀ',start:'AVVIA GIOCO',settings:'IMPOSTAZIONI',back:'INDIETRO',settingsTitle:'IMPOSTAZIONI DI GIOCO',sfx:'Effetti',master:'Volume generale',shake:'Scuotimento schermo',upgrade:'⭐ LIVELLO AUMENTATO!',choose:'Scegli un miglioramento',easy:'Facile',normal:'Normale',hard:'Difficile',extreme:'Estremo'},
ru:{title:'ОХОТНИК НА ЗОМБИ: ULTIMATE',diff:'СЛОЖНОСТЬ',start:'ИГРАТЬ',settings:'НАСТРОЙКИ',back:'НАЗАД',settingsTitle:'НАСТРОЙКИ ИГРЫ',sfx:'Эффекты',master:'Общая громкость',shake:'Тряска экрана',upgrade:'⭐ НОВЫЙ УРОВЕНЬ!',choose:'Выберите улучшение',easy:'Легко',normal:'Нормально',hard:'Сложно',extreme:'Экстрим'}
};
let lang=localStorage.getItem('zh_lang')||'tr',diff=localStorage.getItem('zh_diff')||'normal',multiplier=1;
const diffNames=['easy','normal','hard','extreme'];
function setMultiplier(){multiplier={easy:.75,normal:1,hard:1.35,extreme:1.75}[diff]||1}
function language(l,btn){lang=l;localStorage.setItem('zh_lang',l);document.querySelectorAll('#menu .section:first-of-type .choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active');applyLanguage()}
function difficulty(d,btn){diff=d;localStorage.setItem('zh_diff',d);setMultiplier();document.querySelectorAll('#menu .section:nth-of-type(2) .choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function applyLanguage(){const t=texts[lang];document.getElementById('title').textContent=t.title;document.getElementById('difficultyLabel').textContent=t.diff;document.getElementById('startButton').textContent=t.start;document.getElementById('settingsButton').textContent=t.settings;document.getElementById('settingsTitle').textContent=t.settingsTitle;document.getElementById('backButton').textContent=t.back;document.getElementById('sfxLabel').childNodes[0].textContent=t.sfx+': ';document.getElementById('masterLabel').childNodes[0].textContent=t.master+': ';document.getElementById('shakeLabel').childNodes[0].textContent=t.shake+' ';document.getElementById('upgradeTitle').textContent=t.upgrade;document.getElementById('upgradeDesc').textContent=t.choose;const btns=document.querySelectorAll('#menu .section:nth-of-type(2) .choice');btns.forEach((b,i)=>b.textContent=t[diffNames[i]])}
function setInitialButtons(){const lbtn=[...document.querySelectorAll('#menu .section:first-of-type .choice')].find(b=>b.textContent.toLowerCase()===lang);if(lbtn)language(lang,lbtn);const db=[...document.querySelectorAll('#menu .section:nth-of-type(2) .choice')];const i=diffNames.indexOf(diff);db.forEach(b=>b.classList.remove('active'));if(db[i])db[i].classList.add('active')}
const sfx=document.getElementById('sfx'),master=document.getElementById('master'),shake=document.getElementById('shake');
function loadSettings(){sfx.value=localStorage.getItem('zh_sfx')??80;master.value=localStorage.getItem('zh_master')??100;shake.checked=localStorage.getItem('zh_shake')!=='0';document.getElementById('sfxValue').textContent=sfx.value;document.getElementById('masterValue').textContent=master.value}
sfx.oninput=()=>{document.getElementById('sfxValue').textContent=sfx.value;localStorage.setItem('zh_sfx',sfx.value)};master.oninput=()=>{document.getElementById('masterValue').textContent=master.value;localStorage.setItem('zh_master',master.value)};shake.onchange=()=>localStorage.setItem('zh_shake',shake.checked?'1':'0');
function openSettings(){document.getElementById('menu').style.display='none';document.getElementById('settings').style.display='flex'}
function closeSettings(){document.getElementById('settings').style.display='none';document.getElementById('menu').style.display='flex';applyLanguage()}
let player;
function resetPlayer(){const hp={easy:120,normal:100,hard:80,extreme:60}[diff]||100;player={x:W/2,y:H/2,hp,maxHp:hp,speed:4.2,damage:12,angle:0,cooldown:0,cooldownMax:18,level:1,xp:0,maxXp:40,kills:0,weapon:1,boomerang:0,shuriken:0,tesla:0,frost:0,turret:0,dashCooldown:0,dashPower:110,invuln:0,shootTimer:0}}
resetPlayer();
const keys={w:false,a:false,s:false,d:false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys){keys[k]=true;e.preventDefault()}if(e.code==='Space'||k==='e'){e.preventDefault();dash()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false});
let mouse={x:W/2,y:H/2};canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){mouse.x=t.clientX;mouse.y=t.clientY}},{passive:true});canvas.addEventListener('touchmove',e=>{const t=e.touches[0];if(t){mouse.x=t.clientX;mouse.y=t.clientY}},{passive:true});
let running=false,zombies=[],bullets=[],orbs=[],particles=[],spawnTimer=20;
function startGame(){document.getElementById('menu').style.display='none';document.getElementById('settings').style.display='none';document.getElementById('ui').style.display='flex';document.getElementById('dash').style.display='flex';document.getElementById('upgrade').style.display='none';document.getElementById('message').style.display='none';resetPlayer();zombies=[];bullets=[];orbs=[];particles=[];spawnTimer=10;running=true;updateUI()}
function spawnZombie(){const side=Math.floor(Math.random()*4);let x,y;if(side===0){x=-40;y=Math.random()*H}else if(side===1){x=W+40;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=-40}else{x=Math.random()*W;y=H+40}const hp=(30+player.level*7)*(1+Math.max(0,player.level-5)*.04);zombies.push({x,y,hp,maxHp:hp,speed:(1+Math.random()*.6)*multiplier,radius:18,hitFlash:0})}
function shoot(){if(player.cooldown>0||!zombies.length)return;let nearest=null,distance=Infinity;for(const z of zombies){const d=Math.hypot(z.x-player.x,z.y-player.y);if(d<distance){distance=d;nearest=z}}if(!nearest||distance>800)return;player.angle=Math.atan2(nearest.y-player.y,nearest.x-player.x);let count=player.weapon>=6?3:player.weapon>=2?2:1;for(let i=0;i<count;i++){const spread=(i-(count-1)/2)*.12,angle=player.angle+spread;bullets.push({x:player.x,y:player.y,vx:Math.cos(angle)*16,vy:Math.sin(angle)*16,damage:player.damage*(player.weapon>=6?1.5:1),life:70,radius:4})}player.cooldown=player.cooldownMax}
function dash(){if(!running||player.dashCooldown>0)return;let dx=0,dy=0;if(keys.w)dy--;if(keys.s)dy++;if(keys.a)dx--;if(keys.d)dx++;if(!dx&&!dy){dx=Math.cos(player.angle);dy=Math.sin(player.angle)}else{const len=Math.hypot(dx,dy);dx/=len;dy/=len}player.x=Math.max(20,Math.min(W-20,player.x+dx*player.dashPower));player.y=Math.max(20,Math.min(H-20,player.y+dy*player.dashPower));player.dashCooldown=80;player.invuln=18}
function addXP(amount){player.xp+=amount;while(player.xp>=player.maxXp){player.xp-=player.maxXp;player.level++;player.maxXp=Math.floor(player.maxXp*1.25);openUpgrade();break}}
function openUpgrade(){running=false;const box=document.getElementById('upgrade'),cards=document.getElementById('cards');cards.innerHTML='';const options=[['weapon','🔫 Silah Evrimi','Silah seviyesini artırır.'],['damage','💥 Hasar','Hasarı +8 artırır.'],['speed','⚡ Ateş Hızı','Daha hızlı ateş edersin.'],['heal','❤️ Sağlık','Maksimum canı +25 artırır ve canı doldurur.'],['boomerang','🪃 Bumerang','Çevrende dönen hasar alanı oluşturur.'],['shuriken','⭐ Shuriken','Yakındaki zombilere periyodik hasar verir.'],['tesla','⚡ Tesla','Yakındaki zombilere elektrik hasarı verir.'],['frost','🧊 Buz','Zombileri yavaşlatır.'],['turret','🤖 Taret','Yakındaki zombilere otomatik ateş eder.']];options.sort(()=>Math.random()-.5).slice(0,3).forEach(o=>{const div=document.createElement('div');div.className='card';div.innerHTML='<div class="card-title"><span>'+o[1]+'</span><span>+</span></div><div class="card-desc">'+o[2]+'</div>';div.onclick=()=>upgrade(o[0]);cards.appendChild(div)});box.style.display='flex'}
function upgrade(type){if(type==='weapon'){player.weapon=Math.min(10,player.weapon+1);player.cooldownMax=Math.max(5,player.cooldownMax-2)}else if(type==='damage'){player.damage+=8}else if(type==='speed'){player.cooldownMax=Math.max(4,player.cooldownMax-3)}else if(type==='heal'){player.maxHp+=25;player.hp=player.maxHp}else if(type==='boomerang'){player.boomerang++}else if(type==='shuriken'){player.shuriken++}else if(type==='tesla'){player.tesla++}else if(type==='frost'){player.frost++}else if(type==='turret'){player.turret++}document.getElementById('upgrade').style.display='none';running=true;updateUI()}
function damageZombie(z,amount){z.hp-=amount;z.hitFlash=4;if(z.hp<=0){const i=zombies.indexOf(z);if(i>=0){zombies.splice(i,1);player.kills++;orbs.push({x:z.x,y:z.y,value:10});addXP(10);for(let n=0;n<5;n++)particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:20})}}}
function areaAbilities(){if(player.boomerang>0){const radius=40+player.boomerang*8;for(const z of [...zombies])if(Math.hypot(z.x-player.x,z.y-player.y)<radius)damageZombie(z,.8*player.boomerang)}if(player.shuriken>0&&Math.floor(frame%18)===0){for(const z of [...zombies])if(Math.hypot(z.x-player.x,z.y-player.y)<110)damageZombie(z,4*player.shuriken)}if(player.tesla>0&&Math.floor(frame%12)===0){for(const z of [...zombies])if(Math.hypot(z.x-player.x,z.y-player.y)<100+player.tesla*15)damageZombie(z,5*player.tesla)}if(player.turret>0&&Math.floor(frame%35)===0){const z=zombies.reduce((a,b)=>!a||Math.hypot(b.x-player.x,b.y-player.y)<Math.hypot(a.x-player.x,a.y-player.y)?b:a,null);if(z)damageZombie(z,12*player.turret)}}
let frame=0;
function update(){if(!running)return;frame++;let dx=0,dy=0;if(keys.w)dy--;if(keys.s)dy++;if(keys.a)dx--;if(keys.d)dx++;if(dx||dy){const len=Math.hypot(dx,dy);player.x+=dx/len*player.speed;player.y+=dy/len*player.speed}player.x=Math.max(15,Math.min(W-15,player.x));player.y=Math.max(15,Math.min(H-15,player.y));if(player.cooldown>0)player.cooldown--;if(player.dashCooldown>0)player.dashCooldown--;if(player.invuln>0)player.invuln--;shoot();spawnTimer--;if(spawnTimer<=0){spawnZombie();spawnTimer=Math.max(10,45-player.level*2)}for(const z of zombies){let zx=player.x-z.x,zy=player.y-z.y,d=Math.hypot(zx,zy);if(d>0){let speed=z.speed;if(player.frost>0&&d<250)speed*=Math.max(.3,1-player.frost*.06);z.x+=zx/d*speed;z.y+=zy/d*speed}if(d<30&&player.invuln<=0){player.hp-=.25*multiplier;if(shake.checked)shakeScreen=5;if(player.hp<=0){gameOver();return}}if(z.hitFlash>0)z.hitFlash--}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;let hit=false;for(const z of [...zombies]){if(Math.hypot(b.x-z.x,b.y-z.y)<z.radius+b.radius){damageZombie(z,b.damage);hit=true;break}}if(hit||b.life<=0)bullets.splice(i,1)}for(let i=orbs.length-1;i>=0;i--){const o=orbs[i],d=Math.hypot(player.x-o.x,player.y-o.y);if(d<110){const len=Math.max(1,d);o.x+=(player.x-o.x)/len*5;o.y+=(player.y-o.y)/len*5}if(d<18){addXP(o.value);orbs.splice(i,1)}}areaAbilities();for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}updateUI()}
let shakeScreen=0;
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shakeScreen>0){ctx.translate((Math.random()-.5)*shakeScreen,(Math.random()-.5)*shakeScreen);shakeScreen*=.8;if(shakeScreen<.2)shakeScreen=0}ctx.fillStyle='#08090d';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const o of orbs){ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.arc(o.x,o.y,5,0,Math.PI*2);ctx.fill()}for(const z of zombies){ctx.fillStyle=z.hitFlash?'#fff':'#27ae60';ctx.beginPath();ctx.arc(z.x,z.y,z.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(z.x-6,z.y-4,3,0,Math.PI*2);ctx.arc(z.x+6,z.y-4,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(z.x-20,z.y-28,40,4);ctx.fillStyle='#e74c3c';ctx.fillRect(z.x-20,z.y-28,40*Math.max(0,z.hp/z.maxHp),4)}for(const b of bullets){ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.fillStyle='#e74c3c';ctx.globalAlpha=Math.max(0,p.life/20);ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1}if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle=player.invuln?'#fff':'#3498db';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-14,-13);ctx.lineTo(-9,0);ctx.lineTo(-14,13);ctx.closePath();ctx.fill();ctx.fillStyle='#f1c40f';ctx.fillRect(4,-3,18,6);ctx.restore();if(player.boomerang>0){ctx.strokeStyle='rgba(241,196,15,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,40+player.boomerang*8,0,Math.PI*2);ctx.stroke()}if(player.shuriken>0){ctx.strokeStyle='#00ffff';ctx.beginPath();ctx.arc(player.x,player.y,45+player.shuriken*8,0,Math.PI*2);ctx.stroke()}if(player.tesla>0){ctx.strokeStyle='rgba(0,255,255,.3)';ctx.beginPath();ctx.arc(player.x,player.y,100+player.tesla*15,0,Math.PI*2);ctx.stroke()}if(player.turret>0){ctx.fillStyle='#9b59b6';ctx.fillRect(player.x-7,player.y-30,14,14)}}ctx.restore()}
function updateUI(){if(!player)return;document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp))+'/'+Math.ceil(player.maxHp);document.getElementById('level').textContent=player.level;document.getElementById('xp').textContent=player.xp;document.getElementById('maxxp').textContent=player.maxXp;document.getElementById('kills').textContent=player.kills;document.getElementById('damage').textContent=Math.floor(player.damage);const weapons=['Standart','İkili Tabanca','Taktiksel Seri','Assault Tüfek','Plazma','Ağır Lazer','Foton Topu','Üçlü Dağıtıcı','Yıkıcı Top','Kıyamet'];document.getElementById('weapon').textContent=weapons[Math.min(player.weapon-1,9)]||weapons[0]}
function gameOver(){running=false;document.getElementById('ui').style.display='none';document.getElementById('dash').style.display='none';document.getElementById('upgrade').style.display='none';const m=document.getElementById('message');m.textContent='💀 ÖLDÜN! Öldürme: '+player.kills;m.style.display='block';setTimeout(()=>{m.style.display='none';document.getElementById('menu').style.display='flex';resetPlayer();applyLanguage()},2000)}
function loop(){update();draw();requestAnimationFrame(loop)}
loadSettings();setMultiplier();applyLanguage();setInitialButtons();loop();
</script>
